<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amit CRM - Offline SQLite CRM</title>
    <meta name="description" content="A single-user, 100% offline desktop CRM app built with Tauri v2, React, TypeScript, Tailwind CSS, and local SQLite storage." />
    <meta property="og:title" content="Amit CRM - Offline SQLite CRM" />
    <meta property="og:description" content="A single-user, 100% offline desktop CRM app built with Tauri v2, React, TypeScript, Tailwind CSS, and local SQLite storage." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('amit_crm_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
