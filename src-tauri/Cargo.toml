[package]
name = "amit-crm"
version = "0.1.0"
description = "Amit CRM - 100% Offline Single-User Desktop CRM with Local SQLite"
authors = ["Amit CRM"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
